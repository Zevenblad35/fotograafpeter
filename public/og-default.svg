<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="30%">
      <stop offset="0%" stop-color="#f5f1ea"/>
      <stop offset="100%" stop-color="#ebe4d7"/>
    </radialGradient>
    <radialGradient id="glow" cx="80%" cy="70%">
      <stop offset="0%" stop-color="#c89b6a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c89b6a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Eyebrow line + label -->
  <line x1="80" y1="120" x2="140" y2="120" stroke="#8b5a2b" stroke-width="1"/>
  <text x="155" y="125"
        font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500"
        letter-spacing="3"
        fill="#8b5a2b">SOCIALE FOTOGRAFIE · NIJVERDAL</text>

  <!-- Main title -->
  <text x="80" y="240"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="92" font-weight="300"
        fill="#1a1814"
        letter-spacing="-3">Beleef</text>
  <text x="80" y="335"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="92" font-weight="300"
        fill="#8b5a2b"
        letter-spacing="-3">jouw moment.</text>

  <!-- Subtitle -->
  <text x="80" y="430"
        font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400"
        fill="#4a443c">Bedrijfsfotografie · Personal Branding</text>
  <text x="80" y="465"
        font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400"
        fill="#4a443c">Reclamefotografie · Honden</text>

  <!-- Bottom info -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#d9d0c0"/>

  <text x="80" y="580"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="400"
        fill="#1a1814">Fotograaf Peter</text>
  <text x="80" y="605"
        font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400"
        fill="#7a7268">fotograafpeter.nl · Nijverdal · Twente · Overijssel</text>

  <!-- Right monogram -->
  <circle cx="1080" cy="580" r="44" fill="#1a1814"/>
  <text x="1080" y="580"
        text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="400"
        font-size="34" fill="#f5f1ea"
        letter-spacing="-2">FP</text>
</svg>
